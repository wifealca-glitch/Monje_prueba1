<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D AR</title>
    <!-- Librería oficial corregida para activar el visor 3D -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100%; background-color: #f0f0f0; }
        .ar-button { background-color: #ffffff; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 12px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Atributo src corregido con las mayúsculas exactas -->
    <model-viewer 
        src="./MonjeJul30.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        tone-mapping="neutral"
        shadow-intensity="1">
        <button slot="ar-button" class="ar-button">👋 Ver en mi espacio (AR)</button>
    </model-viewer>

</body>
</html>
