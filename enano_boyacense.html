<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enano Boyacense AR</title>
    
    <!-- Importación del visor de Google -->
    <script type="module" src="https://googleapis.com"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #222222; /* Fondo oscuro general para resaltar el visor */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
        }

        .contenedor-modelo {
            width: 100%;
            max-width: 500px;
            height: 500px;
            background-color: #333333; /* Fondo gris oscuro para contrastar si el modelo es blanco */
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 2px solid #444444;
        }

        model-viewer {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .cuadro-texto {
            margin-top: 20px;
            background-color: #333333;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            max-width: 500px;
            border: 1px solid #444444;
        }

        p {
            margin: 5px 0;
            font-size: 14px;
            color: #eeeeee;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="contenedor-modelo">
        <!-- Añadimos iluminación artificial neutral y centrado forzado de cámara -->
        <model-viewer 
            src="EnanoLigh.glb" 
            alt="Modelo 3D del Enano Boyacense" 
            ar 
            ar-modes="scene-viewer webxr" 
            camera-controls 
            touch-action="pan-y"
            environment-image="neutral"
            shadow-intensity="1"
            exposure="1.5"
            auto-rotate>
        </model-viewer>
    </div>

    <div class="cuadro-texto">
        <p><strong>💻 En Computador:</strong> Si el fondo es oscuro y el enano sigue sin verse, el archivo requiere revisión de mallas.</p>
        <p><strong>📱 En Android:</strong> Abre este enlace. Al forzar la luz neutral, el botón circular de AR se activará en la base tan pronto el motor procese el archivo.</p>
    </div>

</body>
</html>
