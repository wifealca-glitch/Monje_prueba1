<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enano Boyacense AR</title>
    
    <!-- Importación estable del visor 3D de Google -->
    <script type="module" src="https://googleapis.com"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        .contenedor-visor {
            width: 90vw;
            height: 80vh;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }
        .instrucciones {
            margin-top: 15px;
            color: #555;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="contenedor-visor">
        <!-- El parámetro ?v=1 obliga al navegador a saltarse la caché y cargar el modelo real -->
        <model-viewer 
            src="./EnanoLigh.glb?v=1" 
            alt="Modelo 3D del Enano Boyacense" 
            ar 
            ar-modes="scene-viewer webxr" 
            camera-controls 
            touch-action="pan-y">
        </model-viewer>
    </div>

    <div class="instrucciones">
        <p><strong>En PC:</strong> Usa el mouse para rotar y ver el modelo en 3D.</p>
        <p><strong>En Android:</strong> Abre este enlace en tu celular y pulsa el botón flotante para verlo en tu espacio.</p>
    </div>

</body>
</html>
