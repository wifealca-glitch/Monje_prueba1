<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enano Boyacense AR</title>
    
    <!-- Importación oficial y estable de model-viewer -->
    <script type="module" src="https://googleapis.com"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f3f3f3;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
        }

        /* Forzamos dimensiones físicas reales en el contenedor */
        .contenedor-modelo {
            width: 100%;
            max-width: 500px;
            height: 500px; /* Altura fija para evitar que colapse */
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 2px solid #e0e0e0;
        }

        /* Estilo forzado para el visor 3D */
        model-viewer {
            width: 100% !important;
            height: 100% !important;
            display: block;
            background-color: #fcfcfc;
        }

        .cuadro-texto {
            margin-top: 20px;
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        p {
            margin: 5px 0;
            font-size: 14px;
            color: #444;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Contenedor con medidas fijas para forzar la visualización -->
    <div class="contenedor-modelo">
        <model-viewer 
            src="./EnanoLigh.glb" 
            alt="Modelo 3D del Enano Boyacense" 
            ar 
            ar-modes="scene-viewer webxr" 
            camera-controls 
            touch-action="pan-y"
            shadow-intensity="1">
        </model-viewer>
    </div>

    <div class="cuadro-texto">
        <p><strong>💻 En Computador:</strong> Haz clic dentro del recuadro blanco y arrastra con el mouse para rotar el modelo en 3D.</p>
        <p><strong>📱 En Android:</strong> Abre este enlace en tu celular. Te cargará el modelo y abajo a la derecha verás el botón redondo para activarlo en tu habitación.</p>
    </div>

</body>
</html>
