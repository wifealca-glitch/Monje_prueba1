<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enano Boyacense AR</title>
    <!-- Cargamos la librería oficial de Google desde una fuente ultra estable -->
    <script type="module" src="https://unpkg.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        model-viewer {
            width: 95vw;
            height: 90vh;
            background-color: #ffffff;
            border-radius: 12px;
            --ar-button-display: block; /* Fuerza a que el botón nativo de AR sea visible en móviles */
        }
    </style>
</head>
<body>

    <!-- Visor directo sin intermediarios ni scripts de códigos QR -->
    <model-viewer 
        src="./EnanoLigh.glb" 
        alt="Modelo 3D del Enano Boyacense" 
        ar 
        ar-modes="scene-viewer webxr" 
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
