<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enano Boyacense en Realidad Aumentada</title>
    <!-- Importa el componente model-viewer -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        model-viewer {
            width: 100%;
            height: 80vh;
            max-width: 800px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Código corregido con atributos de Realidad Aumentada -->
    <model-viewer 
        src="EnanoLigh.glb" 
        alt="Un modelo 3D del Enano Boyacense" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1" 
        exposure="1">
        
        <!-- Botón personalizado de AR (Opcional, model-viewer crea uno por defecto si se omite) -->
        <button slot="ar-button" style="background-color: #007bff; color: white; border: none; border-radius: 4px; padding: 10px 20px; position: absolute; bottom: 16px; right: 16px; font-size: 14px; cursor: pointer;">
            👋 Ver en tu espacio (AR)
        </button>

    </model-viewer>

</body>
</html>
